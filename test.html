<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <!-- ===== INJECTED CSS ===== -->
    <style>
      /* --- Reset + base --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body {
        height: 100%;
      }
      body {
        font-family: "Segoe UI", Roboto, -apple-system, sans-serif;
        background: linear-gradient(180deg, #12002e 0%, #2b0a4d 45%, #0a0020 100%);
        color: #ffe4fb;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        overflow-x: hidden;
        position: relative;
      }

      /* --- Retro sun (fixed behind content) --- */
      body::before {
        content: "";
        position: fixed;
        top: 12vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(340px, 70vw);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: linear-gradient(180deg, #ffe259 0%, #ffa751 40%, #ff2e88 75%, #b1006b 100%);
        box-shadow: 0 0 80px 20px rgba(255, 46, 136, 0.55);
        z-index: 0;
        -webkit-mask-image: repeating-linear-gradient(
          to bottom,
          #000 0 14px,
          transparent 14px 20px
        );
        mask-image: repeating-linear-gradient(
          to bottom,
          #000 0 14px,
          transparent 14px 20px
        );
        animation: sunRise 6s ease-in-out infinite alternate;
      }
      @keyframes sunRise {
        from { transform: translateX(-50%) translateY(0); }
        to   { transform: translateX(-50%) translateY(-22px); }
      }

      /* --- Perspective neon grid floor --- */
      body::after {
        content: "";
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%) perspective(320px) rotateX(62deg);
        transform-origin: bottom center;
        width: 260%;
        height: 60vh;
        z-index: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(0, 255, 240, 0.85) 2px, transparent 2px),
          linear-gradient(90deg, rgba(255, 46, 136, 0.85) 2px, transparent 2px);
        background-size: 80px 80px;
        animation: gridMove 2.4s linear infinite;
        opacity: 0.9;
      }
      @keyframes gridMove {
        from { background-position: 0 0, 0 0; }
        to   { background-position: 0 80px, 0 0; }
      }

      /* --- Keep content above the background layers --- */
      h1, p, .character {
        position: relative;
        z-index: 2;
      }

      /* --- Neon glowing title --- */
      h1 {
        font-size: clamp(2rem, 7vw, 4.2rem);
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #00fff0;
        text-shadow:
          0 0 6px #00fff0,
          0 0 18px #00fff0,
          0 0 40px #0af,
          0 0 70px #ff2e88;
        margin-bottom: 18px;
        animation: flicker 4s infinite;
      }
      @keyframes flicker {
        0%, 18%, 22%, 100% { opacity: 1; }
        20%                { opacity: 0.7; }
      }

      p {
        font-size: clamp(1rem, 4vw, 1.3rem);
        max-width: 620px;
        line-height: 1.7;
        color: #ffd6f5;
        text-shadow: 0 0 10px rgba(255, 46, 136, 0.6);
        margin-bottom: 28px;
      }

      /* --- Floating character "Blip" --- */
      .character {
        width: 130px;
        height: 130px;
        position: relative;
        margin-bottom: 26px;
        animation: bob 3s ease-in-out infinite;
      }
      .head {
        width: 110px;
        height: 110px;
        background: radial-gradient(circle at 35% 30%, #00fff0, #06b6d4 60%, #0e7490);
        border-radius: 50%;
        position: absolute;
        left: 10px;
        top: 0;
        box-shadow:
          0 0 30px rgba(0, 255, 240, 0.7),
          inset -8px -8px 18px rgba(0, 0, 0, 0.25);
      }
      .eye {
        width: 15px;
        height: 15px;
        background: #12002e;
        border-radius: 50%;
        position: absolute;
        top: 42px;
        box-shadow: inset 0 0 4px #ff2e88;
        animation: blink 4s infinite;
      }
      .eye.left  { left: 28px; }
      .eye.right { right: 28px; }
      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95%           { transform: scaleY(0.1); }
      }
      .mouth {
        width: 34px;
        height: 17px;
        border-bottom: 4px solid #12002e;
        border-radius: 0 0 34px 34px;
        position: absolute;
        left: 38px;
        top: 64px;
      }
      .antenna {
        width: 4px;
        height: 22px;
        background: #ff2e88;
        position: absolute;
        top: -20px;
        left: 63px;
      }
      .antenna::after {
        content: "";
        width: 14px;
        height: 14px;
        background: #ffe259;
        border-radius: 50%;
        position: absolute;
        top: -12px;
        left: -5px;
        box-shadow: 0 0 16px 4px rgba(255, 226, 89, 0.9);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1);   opacity: 1; }
        50%      { transform: scale(1.4); opacity: 0.7; }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-16px); }
      }

      /* --- Accessibility: honor reduced motion --- */
      @media (prefers-reduced-motion: reduce) {
        body::before, body::after,
        h1, .character, .eye, .antenna::after {
          animation: none !important;
        }
      }
    </style>
    <!-- ===== END INJECTED CSS ===== -->
  </head>
  <body>
    <div class="character">
      <div class="antenna"></div>
      <div class="head">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <h1>Welcome to My Website</h1>
    <p>This is my first hand-coded page — now with a synthwave sunset, a rolling neon grid, and Blip, my robot buddy.</p>
  </body>
</html>
